apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: localhost:5001/api-gateway:benchmark
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ORDERS_SERVICE_URL
              value: "http://orders:8081"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory:8082"
            - name: UPSTREAM_TIMEOUT
              value: "25s"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
