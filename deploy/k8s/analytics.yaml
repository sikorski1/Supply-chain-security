apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: localhost:5001/analytics:benchmark
          imagePullPolicy: Always
          env:
            - name: GOOSE_DB_STRING
              value: "postgresql://app:app@postgres:5432/supply_chain?sslmode=disable"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: PYTHONUNBUFFERED
              value: "1"
          readinessProbe:
            exec:
              command: ["python", "health.py"]
            periodSeconds: 5
            timeoutSeconds: 5
