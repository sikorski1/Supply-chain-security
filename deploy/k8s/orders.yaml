apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: localhost:5001/orders:benchmark
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: ADDR
              value: ":8081"
            - name: GOOSE_DB_STRING
              value: "postgresql://app:app@postgres:5432/supply_chain?sslmode=disable"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory:8082"
            - name: PAYMENTS_SERVICE_URL
              value: "http://payments:8083"
            - name: NATS_URL
              value: "nats://nats:4222"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
